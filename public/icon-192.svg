<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#091b30" />
      <stop offset="100%" stop-color="#080c14" />
    </radialGradient>
    <radialGradient id="orbGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5df6ff" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGlow)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Outer Pulse Ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75" />

  <!-- Glowing Orb Core -->
  <circle cx="96" cy="96" r="44" fill="url(#orbGlow)" filter="url(#neonBlur)" />

  <!-- AI Pulse Waves / Deka Monogram -->
  <path d="M 82 78 L 96 66 L 110 78 L 110 114 L 96 126 L 82 114 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" opacity="0.95" />
  <circle cx="96" cy="96" r="6" fill="#ffffff" />
</svg>
